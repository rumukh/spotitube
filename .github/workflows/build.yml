name: Build APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Gradle here is only ever asked to build and test; nothing needs write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The build runs on 21 while the Kotlin/Java toolchain is 17; settings.gradle.kts uses the
      # foojay resolver to provision 17 itself, so only the launcher JDK is pinned here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repo is developed on Windows, where git does not record the executable bit.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotitube-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Uploaded even when the build fails, because a red run is when they are worth reading.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
